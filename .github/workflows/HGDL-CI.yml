# Third-party actions are pinned to full commit SHAs (the version is in the comment), so a
# moved or compromised tag cannot change what runs here with access to the release credentials.

name: HGDL CI

on:
  push:
    branches: [ master ]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [ master ]

# least privilege by default; the deploy job asks for what it needs
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same Python range as fvgp and gpCAM, which depend on hgdl.
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
        deps: [ 'latest' ]
        include:
          # The lower bounds in pyproject.toml, installed exactly, so they stay true.
          - python-version: '3.10'
            deps: 'minimum'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m ensurepip --upgrade
          python -m pip install --upgrade pip setuptools
          pip install -e .[tests]

      - name: Downgrade to minimum supported versions
        if: matrix.deps == 'minimum'
        run: pip install "scipy==1.13.*" "numpy==2.1.*" "dask==2024.1.*" "distributed==2024.1.*"

      - name: Run tests
        run: pytest tests --cov=./ --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # v5+ passes this to the CLI verbatim: a space after the comma breaks the command
          env_vars: OS,PYTHON
          fail_ci_if_error: true
          files: ./coverage.xml
          name: codecov-umbrella
          verbose: true

  deploy:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC); no API token is stored
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # hatch-vcs derives the version from the tag
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip hatch
          hatch build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          verbose: true

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

# TODO: pytest fixes (test file uses interactive stdins during test run)
# TODO: pypi deployment with successful tests on tag pushes

name: HGDL CI

on:
  push:
    branches: [ master ]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same Python range as fvgp and gpCAM, which depend on hgdl.
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
        deps: [ 'latest' ]
        include:
          # The lower bounds in pyproject.toml, installed exactly, so they stay true.
          - python-version: '3.10'
            deps: 'minimum'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m ensurepip --upgrade
          python -m pip install --upgrade pip setuptools
          pip install -e .[tests]

      - name: Downgrade to minimum supported versions
        if: matrix.deps == 'minimum'
        run: pip install "scipy==1.13.*" "numpy==2.1.*" "dask==2024.1.*" "distributed==2024.1.*"

      - name: Run tests
        run: pytest tests --cov=./ --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage/reports/
          env_vars: OS, PYTHON
          fail_ci_if_error: true
          files: ./coverage.xml
          name: codecov-umbrella
          verbose: true

  deploy:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Setup Python 3.10
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Setup deploy
        run: |
          python -m ensurepip --upgrade
          python -m pip install --upgrade setuptools
          pip install --upgrade wheel twine hatch
          hatch build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true

      - name: Github Release
        uses: fnkr/github-action-ghr@v1
        env:
          GHR_COMPRESS: xz
          GHR_PATH: dist/
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

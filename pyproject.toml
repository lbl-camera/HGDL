[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "hgdl"
dependencies = [
    "wheel",
    # Ranges, not `~=` pins, and kept identical to fvgp and gpCAM, which depend on hgdl.
    # hgdl sits at the bottom of that stack, so a `~=` pin here decides the scipy/numpy/
    # dask versions for every fvgp and gpCAM install -- and, because no single release
    # covers Python 3.10 through 3.14, makes pip backtrack to older hgdl releases at both
    # ends of the range. The lower bounds are exercised by the `minimum` CI job.
    "scipy >= 1.13",
    "numpy >= 2.1",
    "dask >= 2024.1",
    "distributed >= 2024.1",
    "loguru",
]
# imate
# pytorch
requires-python = ">=3.10"
authors = [
    { name = "Marcus Michael Noack", email = "MarcusNoack@lbl.gov" },
    { name = "Ronald J. Pandolfi", email = "ronpandolfi@lbl.gov" },
]
maintainers = [
    { name = "Marcus Michael Noack", email = "MarcusNoack@lbl.gov" },
    { name = "Ronald J. Pandolfi", email = "ronpandolfi@lbl.gov" },
]
description = "HGDL Optimization"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["autonomous", "self driving", "adaptive", "gui", "qt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    'Intended Audience :: Developers',
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    "Natural Language :: English",
]
dynamic = ["version"]

[project.optional-dependencies]
docs = ['sphinx', 'pydata-sphinx-theme>=0.15', 'myst-parser', 'myst-nb', 'sphinx-design', 'sphinx-copybutton', 'jupytext']
tests = ['pytest', 'codecov', 'pytest-cov']
plotting = ['matplotlib', 'plotly', 'bokeh']

[project.urls]
Homepage = "https://github.com/lbl-camera/hgdl"
Documentation = "https://hgdl.readthedocs.io/"
Repository = "https://github.com/lbl-camera/hgdl.git"
"Bug Tracker" = "https://github.com/lbl-camera/hgdl/issues"
Changelog = "https://github.com/lbl-camera/hgdl/commits/master/"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "hgdl/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/docs",
    "/examples",
    "/tests",
    "/obsolete",
]

[tool.hatch.build.targets.wheel]
packages = ["hgdl"]

[tool.black]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist

  # The following are specific to Black, you probably don't want those.
  | blib2to3
  | tests/data
)/
'''
